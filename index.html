<!DOCTYPE html>
<html lang="en">
<head><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00F5FF">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Fun Neon Brick Breaker</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #050507;
            font-family: Arial, sans-serif;
        }
        .glassmorphism {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container mx-auto p-4 pt-6 md:p-6 lg:p-12 xl:p-24 glassmorphism">
        <h1 class="text-3xl text-white mb-4">Super Fun Neon Brick Breaker</h1>
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <script>
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            let score = 0;
            let level = 1;
            let paddle = { x: canvas.width / 2, y: canvas.height - 20, width: 100, height: 20 };
            let ball = { x: canvas.width / 2, y: canvas.height / 2, radius: 10, velocity: { x: 2, y: 2 } };
            let bricks = [];
            let powerUps = [];
            let particleSystem = [];

            // Initialize bricks
            for (let i = 0; i < 60; i++) {
                let brick = {
                    x: (i % 10) * 40,
                    y: Math.floor(i / 10) * 20,
                    width: 40,
                    height: 20,
                    color: getRandomColor()
                };
                bricks.push(brick);
            }

            // Main game loop
            function update() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawPaddle();
                drawBall();
                drawBricks();
                updateBall();
                checkCollisions();
                drawScore();
                drawLevel();
                drawPowerUps();
                updatePowerUps();
                drawParticles();
                updateParticles();
                requestAnimationFrame(update);
            }

            // Draw paddle
            function drawPaddle() {
                ctx.fillStyle = 'rgba(0, 255, 0, 0.5)';
                ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            }

            // Draw ball
            function drawBall() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw bricks
            function drawBricks() {
                for (let i = 0; i < bricks.length; i++) {
                    let brick = bricks[i];
                    ctx.fillStyle = brick.color;
                    ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                }
            }

            // Update ball
            function updateBall() {
                ball.x += ball.velocity.x;
                ball.y += ball.velocity.y;

                if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                    ball.velocity.x = -ball.velocity.x;
                }

                if (ball.y - ball.radius < 0) {
                    ball.velocity.y = -ball.velocity.y;
                }

                if (ball.y + ball.radius > canvas.height) {
                    // Game over
                    alert('Game Over!');
                    location.reload();
                }
            }

            // Check collisions
            function checkCollisions() {
                for (let i = 0; i < bricks.length; i++) {
                    let brick = bricks[i];
                    if (checkCollision(ball, brick)) {
                        // Brick collision
                        ball.velocity.y = -ball.velocity.y;
                        bricks.splice(i, 1);
                        score++;
                        createParticles(ball.x, ball.y);
                        createPowerUp();
                    }
                }

                if (checkCollision(ball, paddle)) {
                    // Paddle collision
                    ball.velocity.y = -ball.velocity.y;
                }
            }

            // Draw score
            function drawScore() {
                ctx.font = '24px Arial';
                ctx.fillStyle = 'white';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText('Score: ' + score, 10, 10);
            }

            // Draw level
            function drawLevel() {
                ctx.font = '24px Arial';
                ctx.fillStyle = 'white';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText('Level: ' + level, 10, 40);
            }

            // Create particles
            function createParticles(x, y) {
                for (let i = 0; i < 10; i++) {
                    let particle = {
                        x: x,
                        y: y,
                        velocity: { x: Math.random() * 2 - 1, y: Math.random() * 2 - 1 },
                        radius: Math.random() * 5
                    };
                    particleSystem.push(particle);
                }
            }

            // Draw particles
            function drawParticles() {
                for (let i = 0; i < particleSystem.length; i++) {
                    let particle = particleSystem[i];
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Update particles
            function updateParticles() {
                for (let i = 0; i < particleSystem.length; i++) {
                    let particle = particleSystem[i];
                    particle.x += particle.velocity.x;
                    particle.y += particle.velocity.y;
                    particle.radius -= 0.1;
                    if (particle.radius < 0) {
                        particleSystem.splice(i, 1);
                    }
                }
            }

            // Create power up
            function createPowerUp() {
                let powerUp = {
                    x: ball.x,
                    y: ball.y,
                    type: Math.random() < 0.5 ? 'expandPaddle' : 'slowBall'
                };
                powerUps.push(powerUp);
            }

            // Draw power ups
            function drawPowerUps() {
                for (let i = 0; i < powerUps.length; i++) {
                    let powerUp = powerUps[i];
                    ctx.fillStyle = 'white';
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(powerUp.type === 'expandPaddle' ? 'EP' : 'SB', powerUp.x, powerUp.y);
                }
            }

            // Update power ups
            function updatePowerUps() {
                for (let i = 0; i < powerUps.length; i++) {
                    let powerUp = powerUps[i];
                    powerUp.y += 2;
                    if (powerUp.y > canvas.height) {
                        powerUps.splice(i, 1);
                    }
                    if (checkCollision(ball, powerUp)) {
                        if (powerUp.type === 'expandPaddle') {
                            paddle.width += 20;
                        } else {
                            ball.velocity.y /= 2;
                        }
                        powerUps.splice(i, 1);
                    }
                }
            }

            // Check collision
            function checkCollision(obj1, obj2) {
                if (obj1.x + obj1.radius > obj2.x && obj1.x - obj1.radius < obj2.x + obj2.width && obj1.y + obj1.radius > obj2.y && obj1.y - obj1.radius < obj2.y + obj2.height) {
                    return true;
                }
                return false;
            }

            // Get random color
            function getRandomColor() {
                let colors = ['red', 'orange', 'yellow', 'green', 'blue', 'purple'];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            // Handle touch events
            canvas.addEventListener('touchstart', (e) => {
                let touch = e.touches[0];
                paddle.x = touch.clientX - canvas.offsetLeft - paddle.width / 2;
            });

            canvas.addEventListener('touchmove', (e) => {
                let touch = e.touches[0];
                paddle.x = touch.clientX - canvas.offsetLeft - paddle.width / 2;
            });

            update();
        </script>
    </div>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script></body>
</html>
