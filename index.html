<html>
  <head>
    <title>Full Speed Ahead</title>
  </head>
  <body>
    <h1>Full Speed the Ball</h1>
    <p>Keeping luxury PWA in mind, we will ensure that the ball moves at full speed while maintaining the high-end user experience.</p>
    <div>
      <img src="ball.gif" alt="Ball moving at full speed">
    </div>
    <script>
      // JavaScript code to animate the ball
      var ball = document.querySelector('img');
      ball.style.animation = 'full-speed 2s linear infinite';
    </script>
    <style>
      /* CSS styles to animate the ball */
      @keyframes full-speed {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(100vw);
        }
      }
    </style>
  </body>
</html>
